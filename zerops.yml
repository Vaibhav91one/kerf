# Zerops deploy config for the `backend` service.
#
# TODO before first deploy (task #8): confirm the actual generated env var
# name for the `postgresql` service's connection string in the Zerops
# dashboard — `${db_connectionString}` below is the documented convention
# (hostname-prefixed) but the real service is named `postgresql`, not `db`,
# so this may need to become `${postgresql_connectionString}`. Verify against
# the live project rather than trusting this comment.
#
# `frontend` setup block is not written yet — apps/frontend doesn't exist,
# gated on picking a UI design system with the user first (see CLAUDE.md).

zerops:
  - setup: backend
    build:
      base: nodejs@22
      buildCommands:
        - corepack enable
        - pnpm install --frozen-lockfile
        - pnpm --filter @kerf/backend prisma:generate
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        - name: DATABASE_URL
          content: ${db_connectionString}
        - name: KERF_TOKEN
          content: ${KERF_TOKEN}
      start: sh -c 'cd apps/backend && pnpm run prisma:deploy && pnpm start'
