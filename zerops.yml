# Zerops deploy config for the `backend` and `frontend` services.
# Verified against the live `kerf` project (zcli project env): the postgresql
# service's connection string env var is `${postgresql_connectionString}`.
# Backend's public URL is deterministic from its subdomain host + declared
# port: https://backend-2cf9-3000.prg1.zerops.app — used below as the
# frontend's build-time NEXT_PUBLIC_API_URL (inlined at `next build`, so it
# must be present during build, not just runtime).

zerops:
  - setup: backend
    build:
      base: nodejs@22
      buildCommands:
        - corepack enable
        - pnpm install --frozen-lockfile
        - pnpm --filter @kerf/backend prisma:generate
      deployFiles: ./
      cache:
        - node_modules
      envVariables:
        COREPACK_NPM_REGISTRY: https://registry.npmmirror.com
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        # Express's finalhandler picks its behaviour off NODE_ENV, and it
        # defaults to 'development' when unset — which returns err.stack to the
        # CLIENT on any unhandled error: absolute paths, module layout, and the
        # DB host and user out of a Prisma connection error. This one line is
        # what makes a 500 say "Internal Server Error" instead.
        NODE_ENV: production
        DATABASE_URL: ${postgresql_connectionString}/${postgresql_dbName}
        # Pulled from the project environment. Dropping this line moved the
        # backend to a service-level secret that is not actually wired, and the
        # running process came up without a Clerk secret at all — `clerkAuth`
        # then answers 503 "clerk not configured" and every sign-in path dies,
        # including claiming a handle and `kerf login`.
        CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
        # NOT secret — a Clerk publishable key is meant to ship in client-side
        # JS. Hardcoded deliberately: unlike CLERK_SECRET_KEY there is no
        # project-env variable of this name actually wired in Zerops, and a
        # ${CLERK_PUBLISHABLE_KEY} reference here resolves to empty at
        # runtime — clerkMiddleware() then throws "Publishable key not valid"
        # on every request, not just auth ones (verified live: this broke
        # /api/season/current and /api/skills too). This is a Clerk
        # DEVELOPMENT instance key, capped at ~100 users with no production
        # origin allow-list; swap to a PRODUCTION instance's key (alongside
        # CLERK_SECRET_KEY) before this serves real users.
        CLERK_PUBLISHABLE_KEY: pk_test_c2tpbGxlZC1qYWd1YXItNTkuY2xlcmsuYWNjb3VudHMuZGV2JA
        # Comma-separated origins Clerk will accept a session token as issued
        # for — see auth.ts's clerkAuthorizedParties(). Without this, a Clerk
        # session JWT valid for this instance is accepted here regardless of
        # which site presented it, and the wildcard CORS origin below makes
        # that a reachable path rather than a theoretical one. e.g.
        # https://kerf.example.com
        CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
        # Optional. Without it the GitHub proxy uses the anonymous 60 req/hr/IP
        # budget, which the 10-minute cache makes workable; with it, 5000/hr.
        # Runtime only — putting a secret in build.envVariables bakes it into
        # the build log.
        GITHUB_TOKEN: ${GITHUB_TOKEN}
      start: sh -c 'cd apps/backend && pnpm run prisma:deploy && pnpm start'
      # /health does a SELECT 1, so this withholds traffic from a container
      # whose `prisma migrate deploy` is still running or whose database is
      # unreachable. Without it the platform routes on process liveness alone,
      # and this process binds :3000 happily with no database at all.
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - corepack enable
        - pnpm install --frozen-lockfile
        - pnpm --filter @kerf/frontend build
      deployFiles: ./
      cache:
        - node_modules
      envVariables:
        COREPACK_NPM_REGISTRY: https://registry.npmmirror.com
        NEXT_PUBLIC_API_URL: https://backend-2cf9-3000.prg1.zerops.app
        # Used by robots.ts/sitemap.ts to build absolute URLs. kerf.vaibhav.quest
        # is the real domain (CNAME on Vercel DNS -> Zerops, custom domain
        # added on the frontend service in the Zerops GUI, SSL auto-issued).
        NEXT_PUBLIC_SITE_URL: https://kerf.vaibhav.quest
        # Same key as the backend's CLERK_PUBLISHABLE_KEY above — see that
        # comment for why this is hardcoded rather than a project-env ref.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2tpbGxlZC1qYWd1YXItNTkuY2xlcmsuYWNjb3VudHMuZGV2JA
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        # Same key as the backend's CLERK_PUBLISHABLE_KEY above — see that
        # comment for why this is hardcoded rather than a project-env ref.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2tpbGxlZC1qYWd1YXItNTkuY2xlcmsuYWNjb3VudHMuZGV2JA
      start: sh -c 'cd apps/frontend && pnpm start'
