# Zerops deploy config for the `backend` and `frontend` services.
# Verified against the live `kerf` project (zcli project env): the postgresql
# service's connection string env var is `${postgresql_connectionString}`.
# Backend's public URL is deterministic from its subdomain host + declared
# port: https://backend-2cf9-3000.prg1.zerops.app — used below as the
# frontend's build-time NEXT_PUBLIC_API_URL (inlined at `next build`, so it
# must be present during build, not just runtime).

zerops:
  - setup: backend
    build:
      base: nodejs@22
      buildCommands:
        - corepack enable
        - pnpm install --frozen-lockfile
        - pnpm --filter @kerf/backend prisma:generate
      deployFiles: ./
      cache:
        - node_modules
      envVariables:
        COREPACK_NPM_REGISTRY: https://registry.npmmirror.com
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        # Express's finalhandler picks its behaviour off NODE_ENV, and it
        # defaults to 'development' when unset — which returns err.stack to the
        # CLIENT on any unhandled error: absolute paths, module layout, and the
        # DB host and user out of a Prisma connection error. This one line is
        # what makes a 500 say "Internal Server Error" instead.
        NODE_ENV: production
        DATABASE_URL: ${postgresql_connectionString}/${postgresql_dbName}
        # References a SERVICE-LEVEL secret (backend service's own "Secret
        # variables"), not the project-level CLERK_SECRET_KEY. The project-
        # level var of the SAME name silently never resolved correctly at
        # runtime — process.env.CLERK_SECRET_KEY inside the container kept
        # hashing to a stale value no matter how many times the project var
        # was edited/saved or the service redeployed (verified directly via
        # the container's web terminal). A same-named self-reference
        # (`CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}`) is the likely cause; a
        # differently-named service-level secret sidesteps it entirely.
        CLERK_SECRET_KEY: ${CLERK_SECRET_KEY_VALUE}
        # Production Clerk instance (kerf.vaibhav.quest) — real Google OAuth
        # credentials (Kerf project, kerf-505614, App Auth Platform, published
        # to production — non-sensitive scopes only, no Google verification
        # required), DNS verified via Vercel Domain Connect. Not secret —
        # a publishable key is meant to ship in client-side JS.
        CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsua2VyZi52YWliaGF2LnF1ZXN0JA
        # Comma-separated origins Clerk will accept a session token as issued
        # for — see auth.ts's clerkAuthorizedParties(). Without this, a Clerk
        # session JWT valid for this instance is accepted here regardless of
        # which site presented it, and the wildcard CORS origin below makes
        # that a reachable path rather than a theoretical one. Same same-name
        # self-reference bug as CLERK_SECRET_KEY above (verified live: with
        # the name unchanged, Clerk rejected every token with "Invalid JWT
        # Authorized party claim (azp) ... Expected ${CLERK_AUTHORIZED_PARTIES}"
        # — the literal unresolved string, not a real origin) — same fix,
        # a differently-named service-level secret.
        CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES_VALUE}
        # Optional and currently OMITTED rather than wired: same same-name
        # self-reference bug as the two Clerk vars above, verified live —
        # process.env.GITHUB_TOKEN resolved to the literal string
        # "${GITHUB_TOKEN}", which the proxy then sent to GitHub as
        # `Authorization: Bearer ${GITHUB_TOKEN}`, an invalid credential that
        # made every /api/projects/:id/github call fail with 502 even though
        # the anonymous, unauthenticated request works fine. A broken token is
        # worse than no token, so this is left unset until wired as a
        # differently-named service-level secret (GITHUB_TOKEN_VALUE, say) —
        # without it the proxy uses the anonymous 60 req/hr/IP budget, which
        # the 10-minute cache makes workable; with a real one, 5000/hr.
      start: sh -c 'cd apps/backend && pnpm run prisma:deploy && pnpm start'
      # /health does a SELECT 1, so this withholds traffic from a container
      # whose `prisma migrate deploy` is still running or whose database is
      # unreachable. Without it the platform routes on process liveness alone,
      # and this process binds :3000 happily with no database at all.
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - corepack enable
        - pnpm install --frozen-lockfile
        - pnpm --filter @kerf/frontend build
      deployFiles: ./
      cache:
        - node_modules
      envVariables:
        COREPACK_NPM_REGISTRY: https://registry.npmmirror.com
        NEXT_PUBLIC_API_URL: https://backend-2cf9-3000.prg1.zerops.app
        # Used by robots.ts/sitemap.ts to build absolute URLs. kerf.vaibhav.quest
        # is the real domain (CNAME on Vercel DNS -> Zerops, custom domain
        # added on the frontend service in the Zerops GUI, SSL auto-issued).
        NEXT_PUBLIC_SITE_URL: https://kerf.vaibhav.quest
        # Same key as the backend's CLERK_PUBLISHABLE_KEY above — see that
        # comment for why this is hardcoded rather than a project-env ref.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsua2VyZi52YWliaGF2LnF1ZXN0JA
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        # Same key as the backend's CLERK_PUBLISHABLE_KEY above — see that
        # comment for why this is hardcoded rather than a project-env ref.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsua2VyZi52YWliaGF2LnF1ZXN0JA
      start: sh -c 'cd apps/frontend && pnpm start'
